<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Enter Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F3EA; --mint:#E9F3EA; --mint-line:#BFD8C4; --olive:#7C9473; --olive-dark:#66805C;
    --ink:#242820; --gray:#6B6F63; --input-bg:#E4E2D8; --line:#D8D5C8; --white:#FFFFFF; --red:#C4483E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#ECECEC; font-family:'Inter', sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px 0;}
  .device{width:100%; max-width:400px; height:min(844px, 92vh); background:var(--cream); border-radius:44px; box-shadow:0 40px 80px rgba(24,24,20,0.22), 0 0 0 10px #14170F; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; gap:14px; padding:22px 20px 6px; flex-shrink:0;}
  .back-btn{width:34px; height:34px; border:none; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}

  .scroll{flex:1; overflow-y:auto; padding:8px 30px 30px; display:flex; flex-direction:column;}

  .avatar-circle{
    width:74px; height:74px; border-radius:50%; background:var(--olive); color:var(--white);
    display:flex; align-items:center; justify-content:center; margin:14px auto 18px;
    font-family:'Poppins', sans-serif; font-weight:800; font-size:26px; flex-shrink:0;
  }

  h1{font-family:'Poppins', sans-serif; font-weight:800; font-size:22px; text-align:center; margin-bottom:6px;}
  .email-pill{
    display:block; text-align:center; font-size:12.5px; font-weight:700; color:var(--olive-dark);
    background:var(--mint); border-radius:100px; padding:8px 14px; margin:8px auto 6px; width:fit-content;
  }
  .switch-account{display:block; text-align:center; font-size:12px; color:var(--olive-dark); text-decoration:underline; margin-bottom:26px; background:none; border:none; cursor:pointer; width:100%;}

  .input-group{position:relative; margin-bottom:8px;}
  .input-group i{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--gray); font-size:15px; font-style:normal;}
  .input-group input{
    width:100%; padding:14px 44px 14px 46px; background:var(--input-bg); border:1.5px solid transparent;
    border-radius:20px; font-size:14px; color:var(--ink); outline:none; font-family:'Inter', sans-serif;
  }
  .input-group input:focus{background:var(--white); border-color:var(--olive);}
  .toggle-pw{
    position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:4px;
  }
  .toggle-pw svg{width:18px; height:18px; stroke:var(--gray);}

  .forgot-row{text-align:right; margin:6px 4px 22px;}
  .forgot-row a{font-size:13px; color:var(--ink); text-decoration:underline;}

  p#loginError{color:var(--red); font-size:12.5px; margin:-14px 0 14px; display:none;}

  .btn-signup{
    width:100%; padding:14px; background:var(--olive); color:var(--white); border:none; border-radius:24px;
    font-size:16px; font-weight:600; cursor:pointer; margin-top:auto; transition:background .2s ease;
  }
  .btn-signup:hover{background:var(--olive-dark);}
  .btn-signup:disabled{opacity:.55; cursor:default;}

  .home-indicator{width:120px; height:4px; background:var(--ink); opacity:0.2; border-radius:10px; margin:12px auto 0; flex-shrink:0;}
  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}
  @media (max-width:440px){ body{padding:0; background:var(--cream);} .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;} }
</style>
</head>
<body>

<div class="device">
  <div class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="scroll">
    <div class="avatar-circle" id="avatarInitial">?</div>
    <h1>Welcome back</h1>
    <div class="email-pill" id="emailPill">you@example.com</div>
    <button class="switch-account" id="switchAccountBtn">Not you? Use a different email</button>

    <form id="enterPwForm">
      <div class="input-group">
        <i>🔒</i>
        <input type="password" id="pwInput" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="forgot-row"><a href="ForgetPassword.html">Forgot password?</a></div>

      <button type="submit" class="btn-signup" id="signInBtn">Sign in</button>
    </form>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';
  document.getElementById('emailPill').textContent = email || 'your account';
  document.getElementById('avatarInitial').textContent = (email.trim()[0] || '?').toUpperCase();

  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'Login.html'; });
  document.getElementById('switchAccountBtn').addEventListener('click', () => { window.location.href = 'Login.html'; });

  const pwInput = document.getElementById('pwInput');
  document.getElementById('togglePw').addEventListener('click', () => {
    pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
  });

  const signInBtn = document.getElementById('signInBtn');

  document.getElementById('enterPwForm').addEventListener('submit', (e) => {
    e.preventDefault();
    signInBtn.disabled = true;
    signInBtn.textContent = 'Signing in…';

    // demo-only: any password is accepted here. Replace this with a real
    // sign-in call (Supabase or otherwise) when you're ready to connect
    // a backend.
    setTimeout(() => {
      window.location.href = 'Dashboard1.html';
    }, 500);
  });
})();
</script>

</body>
</html>
