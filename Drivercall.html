<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Calling Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242820; --olive:#7C9473; --olive-dark:#66805C; --red:#C4483E; --white:#FFFFFF;
    --dark:#14170F; --dark2:#1F231A; --gray:#9CA396;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#0A0A08; font-family:'Inter', sans-serif; color:var(--white);
    display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px 0;
  }
  .device{
    width:100%; max-width:400px; height:min(844px, 92vh);
    background:radial-gradient(circle at 50% 20%, var(--dark2), var(--dark));
    border-radius:44px; box-shadow:0 40px 80px rgba(0,0,0,0.5), 0 0 0 10px #000;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }

  .call-top{flex-shrink:0; text-align:center; padding:60px 20px 0;}
  .status-label{font-size:13px; color:var(--gray); letter-spacing:.02em;}
  .status-label.connected{color:var(--olive);}

  .avatar-wrap{position:relative; width:140px; height:140px; margin:26px auto 20px;}
  .avatar-circle{
    width:140px; height:140px; border-radius:50%; background:var(--olive); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins', sans-serif; font-weight:800; font-size:44px;
  }
  .pulse-ring{
    position:absolute; inset:0; border-radius:50%; border:2px solid var(--olive); opacity:0;
  }
  .pulse-ring.active{animation:pulseRing 1.8s ease-out infinite;}
  @keyframes pulseRing{0%{transform:scale(1); opacity:.6;} 100%{transform:scale(1.35); opacity:0;}}

  .driver-name{font-family:'Poppins', sans-serif; font-weight:800; font-size:24px; text-align:center;}
  .driver-meta{font-size:13px; color:var(--gray); text-align:center; margin-top:6px;}
  .timer{font-family:'Poppins', sans-serif; font-size:16px; text-align:center; margin-top:16px; color:var(--olive); font-weight:700; min-height:22px;}

  .call-spacer{flex:1;}

  .call-controls{flex-shrink:0; padding:0 40px 20px;}
  .control-row{display:flex; justify-content:center; gap:24px; margin-bottom:34px;}
  .ctrl-btn{
    width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.1); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--white);
  }
  .ctrl-btn.active{background:var(--white); color:var(--ink);}
  .ctrl-label{display:block; text-align:center; font-size:10.5px; color:var(--gray); margin-top:6px;}
  .ctrl-col{display:flex; flex-direction:column; align-items:center;}

  .end-call-row{display:flex; justify-content:center;}
  .end-call-btn{
    width:66px; height:66px; border-radius:50%; background:var(--red); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 8px 20px rgba(196,72,62,0.4);
  }

  .home-indicator{width:120px; height:4px; background:var(--white); opacity:0.2; border-radius:10px; margin:0 auto 12px; flex-shrink:0;}
  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}
  @media (max-width:440px){ body{padding:0; background:#0A0A08;} .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;} }
</style>
</head>
<body>

<div class="device">
  <div class="call-top">
    <div class="status-label" id="statusLabel">Calling…</div>
    <div class="avatar-wrap">
      <div class="pulse-ring active" id="ring1"></div>
      <div class="pulse-ring active" id="ring2" style="animation-delay:.9s;"></div>
      <div class="avatar-circle" id="avatarInitial">EM</div>
    </div>
    <div class="driver-name" id="driverName">Emeka O.</div>
    <div class="driver-meta" id="driverMeta">Toyota Corolla · LND 245 KJ</div>
    <div class="timer" id="timer"></div>
  </div>

  <div class="call-spacer"></div>

  <div class="call-controls">
    <div class="control-row">
      <div class="ctrl-col">
        <button class="ctrl-btn" id="muteBtn" aria-label="Mute">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
        </button>
        <span class="ctrl-label">Mute</span>
      </div>
      <div class="ctrl-col">
        <button class="ctrl-btn" id="speakerBtn" aria-label="Speaker">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <span class="ctrl-label">Speaker</span>
      </div>
      <div class="ctrl-col">
        <button class="ctrl-btn" id="chatBtn" aria-label="Message">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <span class="ctrl-label">Message</span>
      </div>
    </div>
    <div class="end-call-row">
      <button class="end-call-btn" id="endCallBtn" aria-label="End call">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--white)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(135deg);"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2Z"/></svg>
      </button>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'Your driver';
  const car = params.get('car') || '';
  const plate = params.get('plate') || '';
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  document.getElementById('driverName').textContent = name;
  document.getElementById('driverMeta').textContent = [car, plate].filter(Boolean).join(' · ');
  document.getElementById('avatarInitial').textContent = initials;

  const statusLabel = document.getElementById('statusLabel');
  const timerEl = document.getElementById('timer');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');

  let seconds = 0, timerInterval = null;
  function fmt(s){ const m = Math.floor(s/60); const r = s%60; return m + ':' + String(r).padStart(2,'0'); }

  // demo-only: simulates the call connecting after a couple seconds.
  // A real build would use a telephony/VoIP provider (e.g. Twilio) here.
  setTimeout(() => {
    statusLabel.textContent = 'Connected';
    statusLabel.classList.add('connected');
    ring1.classList.remove('active'); ring2.classList.remove('active');
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = fmt(seconds);
    }, 1000);
  }, 2200);

  document.getElementById('muteBtn').addEventListener('click', function(){ this.classList.toggle('active'); });
  document.getElementById('speakerBtn').addEventListener('click', function(){ this.classList.toggle('active'); });
  document.getElementById('chatBtn').addEventListener('click', () => {
    window.location.href = 'DriverChat.html' + window.location.search;
  });

  document.getElementById('endCallBtn').addEventListener('click', () => {
    clearInterval(timerInterval);
    window.location.href = 'DriveC.html';
  });
})();
</script>

</body>
</html>
