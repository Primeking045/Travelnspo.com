<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Log Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F3EA;
    --mint:#E9F3EA;
    --olive:#7C9473;
    --olive-dark:#66805C;
    --ink:#242820;
    --gray:#6B6F63;
    --white:#FFFFFF;
    --line:#E1DFD3;
    --red:#C4483E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ECECEC;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px 0;
  }
  .device{
    width:100%;
    max-width:400px;
    height:min(844px, 92vh);
    background:var(--cream);
    border-radius:44px;
    box-shadow:0 40px 80px rgba(24,24,20,0.22), 0 0 0 10px #14170F;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .topbar{padding:22px 20px 0; flex-shrink:0;}
  .back-btn{
    width:34px; height:34px; border:none; background:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .content{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 34px;
    text-align:center;
  }
  .icon-circle{
    width:88px; height:88px; border-radius:50%;
    background:rgba(196,72,62,0.12);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
  }
  h2{font-family:'Poppins', sans-serif; font-weight:800; font-size:22px; margin-bottom:10px;}
  .subtext{font-size:14px; line-height:1.6; color:var(--gray); max-width:270px; margin-bottom:32px;}

  .btn{
    display:block; width:100%; text-align:center;
    font-family:'Inter', sans-serif; font-weight:700; font-size:15.5px;
    padding:15px 20px; border-radius:100px; border:none; cursor:pointer;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-red{background:var(--red); color:var(--white); box-shadow:0 12px 24px rgba(196,72,62,0.3); margin-bottom:12px;}
  .btn-red:hover{background:#a83b32; transform:translateY(-2px);}
  .btn-ghost{background:var(--mint); color:var(--ink);}
  .btn-ghost:hover{background:#dfe9df;}

  .home-indicator{width:120px; height:4px; background:var(--ink); opacity:0.2; border-radius:10px; margin:0 auto 12px; flex-shrink:0;}
  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}
  @media (max-width:440px){
    body{padding:0; background:var(--cream);}
    .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;}
  }
</style>
</head>
<body>

<div class="device">

  <div class="topbar">
    <button class="back-btn" aria-label="Back" onclick="window.location.href='Dashboard1.html'">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h2>Log out of TravelInspo?</h2>
    <p class="subtext">You'll need to sign in again to access your trips, savings, and loans.</p>

    <button class="btn btn-red" id="confirmLogoutBtn">Log Out</button>
    <button class="btn btn-ghost" id="cancelLogoutBtn">Cancel</button>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  document.getElementById('confirmLogoutBtn').addEventListener('click', () => {
    // demo-only: this is where you'd clear the real session/auth token
    // before sending the user back to sign up.
    window.location.href = 'signup.html';
  });
  document.getElementById('cancelLogoutBtn').addEventListener('click', () => {
    window.location.href = 'Dashboard1.html';
  });
})();
</script>

</body>
</html>
