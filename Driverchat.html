<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Chat with Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F3EA; --mint:#E9F3EA; --mint-line:#BFD8C4; --olive:#7C9473; --olive-dark:#66805C;
    --ink:#242820; --gray:#6B6F63; --line:#E1DFD3; --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#ECECEC; font-family:'Inter', sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px 0;}
  .device{width:100%; max-width:400px; height:min(844px, 92vh); background:var(--cream); border-radius:44px; box-shadow:0 40px 80px rgba(24,24,20,0.22), 0 0 0 10px #14170F; overflow:hidden; position:relative; display:flex; flex-direction:column;}

  .chat-head{display:flex; align-items:center; gap:12px; padding:20px 18px 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
  .back-btn{width:32px; height:32px; border:none; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .head-avatar{width:38px; height:38px; border-radius:50%; background:var(--olive); color:var(--white); display:flex; align-items:center; justify-content:center; font-family:'Poppins', sans-serif; font-weight:700; font-size:14px; flex-shrink:0;}
  .head-info{flex:1; min-width:0;}
  .head-info b{font-size:14.5px; display:block;}
  .head-info span{font-size:11px; color:var(--olive-dark); font-weight:600;}
  .call-icon-btn{width:36px; height:36px; border-radius:50%; background:var(--mint); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}

  .chat-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:78%; padding:10px 13px; border-radius:16px; font-size:13.5px; line-height:1.45;}
  .msg.driver{align-self:flex-start; background:var(--mint); color:var(--ink); border-bottom-left-radius:4px;}
  .msg.user{align-self:flex-end; background:var(--olive); color:var(--white); border-bottom-right-radius:4px;}
  .msg-time{font-size:9.5px; color:var(--gray); margin-top:3px;}
  .msg.user + .msg-time{text-align:right;}

  .quick-row{display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; flex-shrink:0;}
  .quick-chip{background:var(--white); border:1.4px solid var(--mint-line); color:var(--ink); font-size:12px; font-weight:600; padding:8px 12px; border-radius:100px; cursor:pointer;}
  .quick-chip:hover{background:var(--mint);}

  .typing{align-self:flex-start; display:flex; gap:4px; background:var(--mint); padding:11px 13px; border-radius:16px; border-bottom-left-radius:4px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--gray); opacity:.5; animation:blink 1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3;} 40%{opacity:1;}}

  .chat-input-row{display:flex; align-items:center; gap:10px; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px); border-top:1px solid var(--line); flex-shrink:0; background:var(--cream);}
  .chat-input-row input{flex:1; background:var(--white); border:1.5px solid var(--line); border-radius:100px; padding:12px 16px; font-family:'Inter', sans-serif; font-size:14px; outline:none; color:var(--ink);}
  .chat-input-row input:focus{border-color:var(--olive);}
  .send-btn{width:42px; height:42px; border-radius:50%; background:var(--olive); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .send-btn svg{width:18px; height:18px; stroke:var(--white);}

  .home-indicator{width:120px; height:4px; background:var(--ink); opacity:0.2; border-radius:10px; margin:0 auto 12px; flex-shrink:0;}
  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}
  @media (max-width:440px){ body{padding:0; background:var(--cream);} .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;} }
</style>
</head>
<body>

<div class="device">
  <div class="chat-head">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="head-avatar" id="headAvatar">EM</div>
    <div class="head-info">
      <b id="headName">Emeka O.</b>
      <span>● On the way</span>
    </div>
    <button class="call-icon-btn" id="callBtn" aria-label="Call driver">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--olive-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2Z"/></svg>
    </button>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="msg driver">Hi, I'm on my way to your pickup point.</div>
    <div class="msg-time">2 min ago</div>
    <div class="msg driver">I'm driving a silver Toyota Corolla, plate LND 245 KJ.</div>
    <div class="msg-time">2 min ago</div>
  </div>

  <div class="quick-row" id="quickRow">
    <button class="quick-chip" data-q="I'm outside">I'm outside</button>
    <button class="quick-chip" data-q="On my way">On my way</button>
    <button class="quick-chip" data-q="Please wait, 2 mins">Please wait, 2 mins</button>
  </div>

  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Message your driver…">
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'Your driver';
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('headName').textContent = name;
  document.getElementById('headAvatar').textContent = initials;

  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'DriveC.html'; });
  document.getElementById('callBtn').addEventListener('click', () => {
    window.location.href = 'DriverCall.html' + window.location.search;
  });

  const chatBody = document.getElementById('chatBody');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  function now(){ return 'Just now'; }

  function addMessage(text, who){
    const msg = document.createElement('div');
    msg.className = 'msg ' + who;
    msg.textContent = text;
    chatBody.appendChild(msg);
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();
    chatBody.appendChild(time);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // demo-only: canned driver replies. A real build would relay this
  // through a live messaging channel to the actual driver's app.
  function driverReply(userText){
    const t = userText.toLowerCase();
    if(t.includes('outside')) return "Got it, I see you — pulling up now!";
    if(t.includes('wait')) return "No problem, take your time.";
    if(t.includes('way') || t.includes('coming')) return "Sounds good, see you soon.";
    if(t.includes('where')) return "I'm about 3 minutes out, just past the junction.";
    return "Okay, noted 👍";
  }

  function sendMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    addMessage(text, 'user');
    chatInput.value = '';

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;

    setTimeout(() => {
      typing.remove();
      addMessage(driverReply(text), 'driver');
    }, 700);
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
  document.querySelectorAll('.quick-chip').forEach(chip => {
    chip.addEventListener('click', () => { chatInput.value = chip.dataset.q; sendMessage(); });
  });
})();
</script>

</body>
</html>
