<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Set Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F3EA; --mint:#E9F3EA; --mint-line:#BFD8C4; --olive:#7C9473; --olive-dark:#66805C;
    --ink:#242820; --gray:#6B6F63; --input-bg:#E4E2D8; --line:#D8D5C8; --white:#FFFFFF; --red:#C4483E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#ECECEC; font-family:'Inter', sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px 0;}
  .device{width:100%; max-width:400px; height:min(844px, 92vh); background:var(--cream); border-radius:44px; box-shadow:0 40px 80px rgba(24,24,20,0.22), 0 0 0 10px #14170F; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; gap:14px; padding:22px 20px 6px; flex-shrink:0;}
  .back-btn{width:34px; height:34px; border:none; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}

  .scroll{flex:1; overflow-y:auto; padding:8px 30px 30px; display:flex; flex-direction:column;}

  .art-wrap{width:100px; height:100px; border-radius:50%; background:var(--mint); display:flex; align-items:center; justify-content:center; margin:12px auto 22px; flex-shrink:0;}
  .art-wrap svg{width:44px; height:44px;}

  h1{font-family:'Poppins', sans-serif; font-weight:800; font-size:23px; text-align:center; margin-bottom:8px;}
  .subtext{font-size:13.5px; line-height:1.6; color:var(--gray); text-align:center; max-width:280px; margin:0 auto 8px;}
  .email-pill{
    display:block; text-align:center; font-size:12.5px; font-weight:700; color:var(--olive-dark);
    background:var(--mint); border-radius:100px; padding:8px 14px; margin:10px auto 26px; width:fit-content;
  }

  .input-group{position:relative; margin-bottom:14px;}
  .input-group i{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--gray); font-size:15px;}
  .input-group input{
    width:100%; padding:14px 44px 14px 46px; background:var(--input-bg); border:1.5px solid transparent;
    border-radius:20px; font-size:14px; color:var(--ink); outline:none; font-family:'Inter', sans-serif;
  }
  .input-group input:focus{background:var(--white); border-color:var(--olive);}
  .toggle-pw{
    position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:4px;
  }
  .toggle-pw svg{width:18px; height:18px; stroke:var(--gray);}

  .strength-row{display:flex; gap:5px; margin:2px 0 6px;}
  .strength-row .bar{flex:1; height:4px; border-radius:10px; background:var(--line);}
  .strength-label{font-size:11px; color:var(--gray); margin-bottom:14px;}

  .rules{background:var(--mint); border-radius:14px; padding:12px 14px; margin-bottom:18px;}
  .rule{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--gray); padding:3px 0;}
  .rule.ok{color:var(--olive-dark); font-weight:600;}
  .rule .dot{width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0;}
  .rule.ok .dot{background:var(--olive);}

  p#pwError{color:var(--red); font-size:12.5px; margin:-8px 0 12px; display:none;}

  .btn-signup{
    width:100%; padding:14px; background:var(--olive); color:var(--white); border:none; border-radius:24px;
    font-size:16px; font-weight:600; cursor:pointer; margin-top:auto; transition:background .2s ease;
  }
  .btn-signup:hover{background:var(--olive-dark);}
  .btn-signup:disabled{opacity:.55; cursor:default;}

  .home-indicator{width:120px; height:4px; background:var(--ink); opacity:0.2; border-radius:10px; margin:12px auto 0; flex-shrink:0;}
  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}
  @media (max-width:440px){ body{padding:0; background:var(--cream);} .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;} }
</style>
</head>
<body>

<div class="device">
  <div class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="scroll">
    <div class="art-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--olive-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.4"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.6" fill="var(--olive-dark)" stroke="none"/><path d="M12 16.6V18"/></svg>
    </div>
    <h1>Set your password</h1>
    <p class="subtext">This is what you'll use to sign back in.</p>
    <div class="email-pill" id="emailPill">you@example.com</div>

    <form id="setPwForm">
      <div class="input-group">
        <i class="fa-solid fa-lock" style="font-style:normal;">🔒</i>
        <input type="password" id="pwInput" placeholder="Password" required autocomplete="new-password">
        <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="strength-row" id="strengthRow"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <div class="strength-label" id="strengthLabel">Enter a password</div>

      <div class="input-group">
        <i class="fa-solid fa-lock" style="font-style:normal;">🔒</i>
        <input type="password" id="confirmInput" placeholder="Confirm password" required autocomplete="new-password">
        <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="rules">
        <div class="rule" id="ruleLen"><span class="dot"></span>At least 6 characters</div>
        <div class="rule" id="ruleMatch"><span class="dot"></span>Passwords match</div>
      </div>

      <p id="pwError"></p>

      <button type="submit" class="btn-signup" id="createBtn" disabled>Create Account</button>
    </form>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';
  const username = params.get('username') || '';
  document.getElementById('emailPill').textContent = email || 'your account';

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'signup.html';
  });

  const pwInput = document.getElementById('pwInput');
  const confirmInput = document.getElementById('confirmInput');
  const createBtn = document.getElementById('createBtn');
  const bars = document.querySelectorAll('#strengthRow .bar');
  const strengthLabel = document.getElementById('strengthLabel');
  const ruleLen = document.getElementById('ruleLen');
  const ruleMatch = document.getElementById('ruleMatch');
  const pwError = document.getElementById('pwError');

  function scorePassword(pw){
    let score = 0;
    if(pw.length >= 6) score++;
    if(pw.length >= 10) score++;
    if(/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    if(/[^a-zA-Z0-9]/.test(pw)) score++;
    return score;
  }
  const LABELS = ['Too short', 'Weak', 'Okay', 'Good', 'Strong'];
  const COLORS = ['#C4483E', '#C4483E', '#B08B3E', '#7C9473', '#66805C'];

  function refresh(){
    const pw = pwInput.value;
    const cf = confirmInput.value;
    const score = pw ? scorePassword(pw) : 0;

    bars.forEach((b, i) => { b.style.background = i < score ? COLORS[score] : '#D8D5C8'; });
    strengthLabel.textContent = pw ? LABELS[score] : 'Enter a password';
    strengthLabel.style.color = pw ? COLORS[score] : '#6B6F63';

    const lenOk = pw.length >= 6;
    const matchOk = pw.length > 0 && pw === cf;
    ruleLen.classList.toggle('ok', lenOk);
    ruleMatch.classList.toggle('ok', matchOk);

    createBtn.disabled = !(lenOk && matchOk);
  }
  pwInput.addEventListener('input', refresh);
  confirmInput.addEventListener('input', refresh);
  refresh();

  [['togglePw1', pwInput], ['togglePw2', confirmInput]].forEach(([id, input]) => {
    document.getElementById(id).addEventListener('click', () => {
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  document.getElementById('setPwForm').addEventListener('submit', (e) => {
    e.preventDefault();
    pwError.style.display = 'none';
    createBtn.disabled = true;
    createBtn.textContent = 'Creating account…';

    // demo-only: no real account is created here. Replace this with a
    // real signup call (Supabase or otherwise) when you're ready to
    // connect a backend.
    setTimeout(() => {
      window.location.href = 'Signotp.html?email=' + encodeURIComponent(email);
    }, 600);
  });
})();
</script>

</body>
</html>
