<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelInspo — Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F3EA;
    --mint:#E9F3EA;
    --mint-line:#BFD8C4;
    --olive:#7C9473;
    --olive-dark:#66805C;
    --ink:#242820;
    --gray:#6B6F63;
    --line:#E1DFD3;
    --input-bg:#E4E2D8;
    --white:#FFFFFF;
    --red:#C4483E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#ECECEC;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px 0;
  }

  .device{
    width:100%;
    max-width:400px;
    height:min(844px, 92vh);
    background:var(--cream);
    border-radius:44px;
    box-shadow:0 40px 80px rgba(24,24,20,0.22), 0 0 0 10px #14170F;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    padding:22px 20px 6px;
    flex-shrink:0;
  }
  .back-btn{
    width:34px; height:34px;
    border:none; background:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }

  .scroll{
    flex:1;
    overflow-y:auto;
    padding:8px 30px 30px;
    display:flex;
    flex-direction:column;
  }

  .art-wrap{
    width:130px; height:130px;
    border-radius:50%;
    background:var(--mint);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:18px auto 26px;
    flex-shrink:0;
  }
  .art-wrap svg{width:60px; height:60px;}

  h1{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:25px;
    text-align:center;
    margin-bottom:10px;
  }
  .subtext{
    font-size:14px;
    line-height:1.6;
    color:var(--gray);
    text-align:center;
    max-width:290px;
    margin:0 auto 30px;
  }

  form{display:flex; flex-direction:column;}

  .field{
    position:relative;
    margin-bottom:16px;
  }
  .field svg{
    position:absolute; left:18px; top:50%; transform:translateY(-50%);
    width:19px; height:19px;
    stroke:var(--gray);
    pointer-events:none;
  }
  .field input{
    width:100%;
    background:var(--input-bg);
    border:1.5px solid transparent;
    border-radius:100px;
    padding:16px 18px 16px 50px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .field input::placeholder{color:var(--gray);}
  .field input:focus{border-color:var(--olive); background:var(--white);}

  .btn{
    display:block;
    width:100%;
    text-align:center;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px 20px;
    border-radius:100px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    text-decoration:none;
  }
  .btn-solid{
    background:var(--olive);
    color:var(--white);
    box-shadow:0 12px 24px rgba(124,148,115,0.35);
    margin-top:6px;
  }
  .btn-solid:hover{background:var(--olive-dark); transform:translateY(-2px);}
  .btn-solid:disabled{opacity:0.6; cursor:default; transform:none;}

  .back-to-signin{
    margin-top:26px;
    text-align:center;
    font-size:14px;
    color:var(--gray);
  }
  .back-to-signin a{
    color:var(--ink);
    font-weight:700;
    text-decoration:underline;
  }

  .error-msg{
    font-size:12.5px;
    color:var(--red);
    margin:-10px 0 14px 4px;
    display:none;
  }
  .error-msg.show{display:block;}

  /* ---------- confirmation state ---------- */
  .confirm{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-bottom:40px;
  }
  .confirm.show{display:flex;}
  .confirm .art-wrap{background:var(--olive); margin-bottom:22px;}
  .confirm p.email{
    font-weight:700;
    color:var(--ink);
    margin-bottom:24px;
  }
  .resend{
    background:none; border:none;
    color:var(--olive-dark);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-decoration:underline;
    margin-top:6px;
  }

  .home-indicator{
    width:120px; height:4px;
    background:var(--ink);
    opacity:0.2;
    border-radius:10px;
    margin:0 auto 12px;
    flex-shrink:0;
  }

  :focus-visible{outline:3px solid var(--olive); outline-offset:2px;}

  @media (max-width:440px){
    body{padding:0; background:var(--cream);}
    .device{max-width:none; width:100%; height:100vh; border-radius:0; box-shadow:none;}
  }
</style>
</head>
<body>

<div class="device">

  <div class="topbar">
    <button class="back-btn" aria-label="Back" onclick="window.location.href='signin.html'">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="scroll">

    <!-- request state -->
    <div id="requestState">
      <div class="art-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--olive-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2.4"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15" r="1.6" fill="var(--olive-dark)" stroke="none"/>
          <path d="M12 16.6V18"/>
        </svg>
      </div>

      <h1>Forgot password?</h1>
      <p class="subtext">No worries — enter the email linked to your account and we'll send you a link to reset it.</p>

      <form id="resetForm">
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="email" id="emailInput" placeholder="E-mail or Username" required autocomplete="email">
        </div>
        <p class="error-msg" id="errorMsg">Enter a valid e-mail to continue.</p>

        <button type="submit" class="btn btn-solid" id="submitBtn">Send reset link</button>
      </form>

      <p class="back-to-signin">Remembered your password? <a href="login.html">Sign in</a></p>
    </div>

    <!-- confirmation state -->
    <div class="confirm" id="confirmState">
      <div class="art-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--white)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>Check your email</h1>
      <p class="subtext">We've sent a password reset link to</p>
      <p class="email" id="confirmEmail">you@example.com</p>
      <a href="mailto:" class="btn btn-solid" style="max-width:220px;">Open Email App</a>
      <button class="resend" id="resendBtn">Didn't get it? Resend link</button>
    </div>

  </div>

  <div class="home-indicator"></div>
</div>

<script>
(function(){
  const form = document.getElementById('resetForm');
  const emailInput = document.getElementById('emailInput');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const requestState = document.getElementById('requestState');
  const confirmState = document.getElementById('confirmState');
  const confirmEmail = document.getElementById('confirmEmail');
  const resendBtn = document.getElementById('resendBtn');

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = emailInput.value.trim();
    if(!isValidEmail(value)){
      errorMsg.classList.add('show');
      emailInput.style.borderColor = 'var(--red)';
      return;
    }
    errorMsg.classList.remove('show');

    // demo-only: replace with a real API call to trigger the reset email
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    setTimeout(() => {
      confirmEmail.textContent = value;
      requestState.style.display = 'none';
      confirmState.classList.add('show');
    }, 700);
  });

  emailInput.addEventListener('input', () => {
    errorMsg.classList.remove('show');
    emailInput.style.borderColor = 'transparent';
  });

  resendBtn.addEventListener('click', () => {
    resendBtn.textContent = 'Link resent ✓';
    setTimeout(() => { resendBtn.textContent = "Didn't get it? Resend link"; }, 2500);
  });
})();
</script>

</body>
</html>
